# Netlify settings for The Balm website.
# These run on the server and protect visitors. Plain words in each comment.

[build]
  publish = "."
  command = ""          # no build step needed on Netlify; run `python build.py` on your PC before pushing

# Show our own 404 page for any address that doesn't exist
[[redirects]]
  from = "/*"
  to = "/404.html"
  status = 404

# ---------- Security headers: apply to every page ----------
[[headers]]
  for = "/*"
  [headers.values]
    # Only load scripts, styles, fonts and images from our own site. Blocks injected code.
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; form-action 'self'; frame-ancestors 'none'; base-uri 'self'; object-src 'none'; upgrade-insecure-requests"
    # Always use HTTPS (padlock), for a year, including subdomains
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    # Nobody can put our site inside their own page to trick people (clickjacking)
    X-Frame-Options = "DENY"
    # Browsers must not guess file types (stops a class of attacks)
    X-Content-Type-Options = "nosniff"
    # When people click a link away from us, only share our domain, not the full page address
    Referrer-Policy = "strict-origin-when-cross-origin"
    # We never need camera, microphone, location etc. — switch them off
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()"
    Cross-Origin-Opener-Policy = "same-origin"

# ---------- Speed: let browsers keep files they've already downloaded ----------
[[headers]]
  for = "/assets/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
[[headers]]
  for = "/assets/images/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000"
[[headers]]
  for = "/assets/css/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"
[[headers]]
  for = "/assets/js/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

# Keep the source and builder private
[[redirects]]
  from = "/src/*"
  to = "/404.html"
  status = 404
  force = true
[[redirects]]
  from = "/build.py"
  to = "/404.html"
  status = 404
  force = true
