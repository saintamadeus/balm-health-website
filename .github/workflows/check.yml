# Runs every check on each push and pull request.
# A red ❌ on GitHub means something broke; click it to see which check failed.
name: Check

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Type check
        run: npm run typecheck
      - name: Unit and whole-site tests
        run: npm test
      - name: Build
        run: npm run build
      - name: Install test browser
        run: npx playwright install --with-deps chromium
      - name: Browser tests (accessibility + interactions)
        run: npm run test:browser
      - name: Save the test report if something failed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
